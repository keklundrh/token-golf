id: hole-003
name: "String Reversal"
difficulty: medium
description: |
  Write a Python function called `reverse_string` that takes a string and returns it reversed.

  Your function should:
  - Accept one parameter: `s` (a string)
  - Return the string reversed
  - Handle edge cases like empty strings and single characters
  - Preserve all characters including spaces and special characters

  Function signature: `def reverse_string(s):`

task_type: coding

validation:
  type: test_cases
  language: python
  criteria:
    - name: "Basic reversal"
      input:
        s: "hello"
      expected_output: "olleh"

    - name: "Empty string"
      input:
        s: ""
      expected_output: ""

    - name: "Single character"
      input:
        s: "a"
      expected_output: "a"

    - name: "With spaces"
      input:
        s: "hello world"
      expected_output: "dlrow olleh"

    - name: "Special characters"
      input:
        s: "Hello, World!"
      expected_output: "!dlroW ,olleH"

    - name: "Numbers and symbols"
      input:
        s: "Python3.11"
      expected_output: "11.3nohtyP"

system_prompt:
  default: "You are a helpful Python coding assistant. Write efficient, clean code."
  removable: false
  editable: true

parameters:
  max_iterations: null
  time_limit_seconds: null
  hints_available: 0

metadata:
  author: "Token Golf Team"
  created_date: "2026-09-21"
  tags: ["python", "strings", "basics", "edge_cases"]
  estimated_tokens_expert: 150
  estimated_tokens_beginner: 400
  estimated_difficulty: 2.5
