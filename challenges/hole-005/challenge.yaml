id: hole-005
name: "FizzBuzz"
difficulty: hard
description: |
  Implement the classic FizzBuzz function in Python.

  Write a function called `fizzbuzz` that takes an integer `n` and returns a list
  of strings for numbers from 1 to n (inclusive).

  Rules:
  - For multiples of 3, use "Fizz" instead of the number
  - For multiples of 5, use "Buzz" instead of the number
  - For multiples of both 3 and 5, use "FizzBuzz"
  - For all other numbers, use the number as a string

  Function signature: `def fizzbuzz(n):`

  Example: fizzbuzz(5) returns ["1", "2", "Fizz", "4", "Buzz"]

task_type: coding

validation:
  type: test_cases
  language: python
  criteria:
    - name: "Basic FizzBuzz (15)"
      input:
        n: 15
      expected_output: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]

    - name: "Single element"
      input:
        n: 1
      expected_output: ["1"]

    - name: "Multiple of 3 only"
      input:
        n: 3
      expected_output: ["1", "2", "Fizz"]

    - name: "Multiple of 5 only"
      input:
        n: 5
      expected_output: ["1", "2", "Fizz", "4", "Buzz"]

    - name: "Contains FizzBuzz"
      input:
        n: 30
      expected_output: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz", "16", "17", "Fizz", "19", "Buzz", "Fizz", "22", "23", "Fizz", "Buzz", "26", "Fizz", "28", "29", "FizzBuzz"]

    - name: "Edge case: 100"
