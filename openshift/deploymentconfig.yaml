apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: token-golf
  labels:
    app: token-golf
spec:
  replicas: 1
  # DC selectors are a plain label map (NOT Deployment's matchLabels form —
  # that's a BadRequest at apply time).
  selector:
    app: token-golf
  strategy:
    type: Rolling
  template:
    metadata:
      labels:
        app: token-golf
    spec:
      containers:
        - name: token-golf
          image: image-registry.openshift-image-registry.svc:5000/token-golf/token-golf:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: token-golf-keys
          env:
            - name: DATABASE_PATH
              value: /data/token-golf.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: token-golf-data
  # `triggers` only exists on DeploymentConfig, NOT on plain Deployment —
  # on a Deployment the API server silently strips this field and image
  # updates never roll the pod (the bug that motivated this conversion).
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - token-golf
        from:
          kind: ImageStreamTag
          name: token-golf:latest
