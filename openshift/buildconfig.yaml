apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: token-golf
  labels:
    app: token-golf
spec:
  source:
    git:
      uri: https://github.com/keklundrh/token-golf.git
      ref: dev
  strategy:
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: token-golf:latest
  triggers:
    - type: ConfigChange
    - type: GenericWebHook
      generic:
        # secret value lives in the token-golf-webhook-secret Secret,
        # applied by hand (see README) — never committed to git
        secretReference:
          name: token-golf-webhook-secret
        allowEnv: false
