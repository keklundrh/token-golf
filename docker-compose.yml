version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: token-golf-web
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app
      - ./challenges:/app/challenges
      - ./static:/app/static
      - ./tests:/app/tests
      # Mount data directory for SQLite database
      - ./data:/app/data
      # Mount Alembic migration files
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      # Load from .env file
      - ENV=${ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/token_golf.db}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS:-3}
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - tailwind
    networks:
      - token-golf-network
    restart: unless-stopped

  # Tailwind CSS builder for development
  # Rebuilds CSS when templates or styles change
  # Run manually: podman-compose run --rm tailwind npm run tailwind:build
  tailwind:
    image: node:20-alpine
    container_name: token-golf-tailwind
    working_dir: /app
    volumes:
      - ./static:/app/static
      - ./app:/app/app
      - ./templates:/app/templates
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./package.json:/app/package.json
      - tailwind_node_modules:/app/node_modules
    command: >
      sh -c "
        npm install --silent &&
        echo 'Building Tailwind CSS...' &&
        npm run tailwind:build &&
        echo 'CSS built successfully. Use npm run tailwind:build to rebuild.' &&
        tail -f /dev/null
      "
    networks:
      - token-golf-network
    profiles:
      - tools

  # PostgreSQL for production-like testing
  # (Can be disabled for MVP development using SQLite)
  postgres:
    image: postgres:16-alpine
    container_name: token-golf-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-token_golf}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - token-golf-network
    restart: unless-stopped
    profiles:
      - postgres

networks:
  token-golf-network:
    driver: bridge

volumes:
  postgres_data:
  tailwind_node_modules:
