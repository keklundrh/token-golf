  - id: cache-second
    label: "Cache read (run within ~5 min of the first)"
    detail: "Caching on. If the prefix above is unchanged, this run READS from the cache at ~0.1x input rate — the payoff. Run within ~5 min of the first cached swing (TTL 5m)."
    caching: true
