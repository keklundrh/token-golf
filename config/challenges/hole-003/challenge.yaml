id: 3
question: "A sweater and a shirt together cost 110. The sweater costs 100 more than the shirt. How much is the shirt?"
takeaway: "Thinking tokens cost real money — spend them only on problems that need reasoning, not on ones your first instinct gets right."
model: "anthropic/claude-sonnet-4-5"
options:
  - id: thinking
    label: "With thinking"
    detail: >-
      Give model time to think "out loud" to itself. The model writes notes and reasons which 
      consume tokens. Extremely helpful. Use when necessary.
    prompt: |
      Take your time and reason carefully before answering. Answer with a 
      single sentence. {question}
    thinking: "high"
  - id: no-thinking
    label: "Without thinking"
    detail: >- 
      Model answers immediatel without extended thinking, or reasoning, about the problem.
    prompt: |
      Answer immediately with your first instinct. {question}
