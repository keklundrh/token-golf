id: 1
par: 3
question: "Why is the sky blue"
model: "openai/gpt-5-mini"
options:
  - id: verbose
    label: "Detailed explanation"
    detail: "Long system prompt, unconstrained output. Big club, big spend."
    prompt: |
      You are a thorough science teacher. Explain in complete detail why
      {question}. Cover the physics, the history of the discovery, and
      related phenomena. Use several paragraphs.
  - id: balanced
    label: "Clear summary"
    detail: "Moderate system prompt, one paragraph. A fairway club."
    prompt: |
      Explain clearly and concisely why {question}. One paragraph.
  - id: terse
    label: "One sentence"
    detail: "Hard constraint on output length. A putter — minimal spend."
    prompt: |
      Answer in exactly one sentence: {question}
