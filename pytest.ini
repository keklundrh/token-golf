[pytest]
# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio Configuration
asyncio_mode = auto

# Test Markers
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (moderate speed, database/API interaction)
    e2e: End-to-end tests (slow, full system testing)
    slow: Tests that take a long time to run
    auth: Authentication and authorization tests
    challenge: Challenge loading and validation tests
    session: Game session management tests
    leaderboard: Leaderboard and scoring tests

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Coverage Options (when running with --cov)
# Run with: pytest --cov=app --cov-report=html
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
